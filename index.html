<style>
:root{
  --ground:#F6F5F2; --card:#FFFFFF; --line:#E2DFD8;
  --ink:#14161A; --mut:#6E727A; --teal:#0E5B54; --red:#A3271E;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--sans);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}
.gate{
  width:100%; max-width:380px; background:var(--card);
  border:1px solid var(--line); border-radius:14px; padding:28px 24px 24px;
}
.lock{width:26px;height:26px;display:block;margin-bottom:14px;color:var(--teal)}
h1{font-size:19px; line-height:1.3; margin:0 0 6px; letter-spacing:-.01em}
p.sub{font-size:14px; line-height:1.5; color:var(--mut); margin:0 0 20px}
label{display:block; font-size:12px; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; color:var(--mut); margin-bottom:7px}
input{
  width:100%; font:inherit; font-size:16px; padding:11px 12px;
  border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink);
}
input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,91,84,.12)}
button{
  width:100%; margin-top:14px; font:inherit; font-size:15px; font-weight:600;
  padding:12px; border:0; border-radius:9px; background:var(--teal); color:#fff;
  cursor:pointer;
}
button:disabled{opacity:.55; cursor:default}
.err{color:var(--red); font-size:13.5px; line-height:1.45; margin:12px 0 0; min-height:1px}
.note{font-size:12.5px; line-height:1.5; color:var(--mut); margin:18px 0 0;
  border-top:1px solid var(--line); padding-top:14px}
@media (prefers-color-scheme: dark){
  :root{--ground:#111214; --card:#191B1E; --line:#2C2F34; --ink:#F2F1ED; --mut:#9BA0A8; --teal:#3E9B90}
  input{background:#111214}
}
</style>

(function () {
  var P = window.__ENC;
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function el(id){ return document.getElementById(id); }

  function unlock(pw){
    var subtle = crypto.subtle;
    return subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return subtle.deriveKey(
          { name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256' },
          base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(key){
        return subtle.decrypt({ name:'AES-GCM', iv:b64(P.iv) }, key, b64(P.ct));
      })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }

  /* Replace the whole document with the original one. document.open() clears
     this shell, and the written markup is parsed from the top, so the original
     page's own styles and scripts run normally. The URL does not change, so
     links and #hash tabs behave exactly as they did before it was locked. */
  function reveal(html){
    var hash = location.hash;
    document.open();
    document.write(html);
    document.close();
    if (hash) { try { location.hash = hash; } catch (e) {} }
  }

  el('form').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = el('pw').value, btn = el('go');
    el('err').textContent = '';
    btn.disabled = true; btn.textContent = 'Opening';
    unlock(pw)
      .then(reveal)
      .catch(function(){
        el('err').textContent = 'That password did not work. Try again.';
        btn.disabled = false; btn.textContent = 'Open';
        el('pw').value = ''; el('pw').focus();
      });
  });

  if (!window.crypto || !crypto.subtle) {
    el('err').textContent = 'This browser cannot open the page. It needs a secure connection (https) and a current browser.';
    el('go').disabled = true;
  }
})();
